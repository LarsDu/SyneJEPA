[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synejepa"
version = "0.1.0"
description = "Audio leJEPA for learning audio embeddings via self-supervised learning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "timm>=1.0",
    "datasets>=2.14",

    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synejepa"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
