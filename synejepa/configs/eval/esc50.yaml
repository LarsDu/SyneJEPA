# Evaluation config for ESC-50

eval:
  checkpoint_path: checkpoints/fma_small/checkpoint_epoch_0199.pt
  dataset: esc50
  data_dir: data/esc50

  linear_probe:
    epochs: 100
    lr: 1e-3
    batch_size: 64
    n_folds: 5

  knn:
    k_values: [5, 20]

  metrics:
    compute_isotropy: true
    compute_effective_rank: true
    compute_retrieval: true
    retrieval_k: 5

data:
  sample_rate: 16000
  n_mels: 128
  n_fft: 1024
  hop_length: 160
  window_sec: 4.0

model:
  embed_dim: 384
  depth: 12
  num_heads: 6
  patch_size: 16
  proj_hidden_dim: 2048
  proj_output_dim: 256
