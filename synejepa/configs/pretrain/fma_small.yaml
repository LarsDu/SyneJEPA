# SyneJEPA pretraining config for FMA Small on RTX 4070 Ti (12GB VRAM)

data:
  dataset: fma_small
  data_dir: data/fma_small
  cache_dir: data/cache
  sample_rate: 16000
  n_mels: 128
  n_fft: 1024
  hop_length: 160
  window_sec: 4.0
  patch_size: 16
  mask_ratio_min: 0.4
  mask_ratio_max: 0.6
  view_shift_sec: 0.5
  num_workers: 4

model:
  embed_dim: 384
  depth: 12
  num_heads: 6
  patch_size: 16
  proj_hidden_dim: 2048
  proj_output_dim: 256
  use_gradient_checkpointing: true

training:
  epochs: 200
  batch_size: 8
  gradient_accumulation_steps: 16
  lr: 1e-4
  weight_decay: 0.05
  warmup_epochs: 10
  lambda_sigreg: 0.5
  num_slices: 512
  checkpoint_dir: checkpoints/fma_small
  log_dir: tb_logs/fma_small
  checkpoint_every: 10
  use_amp: true
